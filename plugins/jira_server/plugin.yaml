id: jira_server
name: Jira Server Connector
version: 0.1.0
kind: source_connector
description: Connects to Jira Server/Data Center via REST
entrypoint: plugins.jira_server.main:JiraServerPlugin
enabled_by_default: true
capabilities:
  auth:
    - bearer
    - basic
config_schema:
  type: object
  required: [base_url, auth_type, secret_alias]
  properties:
    base_url:
      type: string
    auth_type:
      type: string
      enum: [bearer, basic]
    secret_alias:
      type: string
actions:
  - name: search_issues
    description: Search Jira issues by JQL
    output_type: record_set
    supports_preview: true
  - name: get_issue
    description: Get full issue details
    output_type: record_set
