[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-web-client-wrapper-backend"
version = "0.1.0"
description = "Backend for OpenAPI Web Client Wrapper"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.4",
  "jsonschema>=4.23.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.2",
  "sqlalchemy>=2.0.39",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3",
  "ruff>=0.11.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
